<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="container-fluid">
        <nav class="row">  
            <div class="d-flex flex-column justify-content-center align-items-center gap-2 flex-sm-row justify-content-sm-between bg-blue text-white py-2 px-sm-5">
                <span class=""><i class="fa-solid fa-phone"></i><span>+91 8374902234</span> </span>
                <div class="d-flex justify-content-around gap-4">
                    <i class="fa-brands fa-facebook fs-3"></i>
                    <i class="fa-brands fa-linkedin fs-3"></i>
                    <i class="fa-brands fa-twitter fs-3"></i>
                    <i class="fa-brands fa-youtube fs-3"></i>
                </div> 
            </div>
                <div class="d-flex flex-wrap align-items-center justify-content-between px-sm-4 py-1 py-sm-0">
                    <div class="order-1 me-3 me-sm-0">
                        <i class=" fa-regular fa-circle-user fs-1 text-blue pe-2 "></i>
                    </div>
    
                    <div class="d-flex justify-content-center text-blue order-2 order-sm-3">
                        <a class="text-decoration-none text-blue "data-bs-toggle="modal" data-bs-target="#cartModal" style="cursor: pointer;">
                            <span class="badge bg-danger text-light translate-middle-y" id="cartCount" style="font-size:9px"></span><i class="fa-solid fa-bag-shopping pe-2 pe-md-0" style="font-size:20px"></i>
                            <span class="d-none d-md-inline pe-2 border-end border-1">CART: (<span id="totalPrice">0</span>$)</span>
                        </a>
                        <div>
                            <i class="fa-regular fa-heart ps-2 pe-md-0"></i>
                            <span class="d-none d-md-inline">Wishlist</span>
                        </div>
                     </div>
                    <form class="search-container d-flex justify-content-center align-items-center order-3 order-sm-2 pt-2 flex-grow-1" role="search">
                        <div class="position-relative w-75 mt-2 " >
                            <input class="form-control me-2 w-100" id="titleSearch"  placeholder="Search a Book" aria-label="Search"/>
                            <span class="position-absolute top-50 end-0 translate-middle-y pe-3">
                                <i class="fa-solid fa-magnifying-glass text-blue"></i>
                            </span>
                         </div>
                    </form>
                </div>
                <hr class="mx-auto" style="width: 95%">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb justify-content-center">
                        <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-blue">HOME</a></li>
                        <li class="breadcrumb-item active text-blue " aria-current="page">PRODUCTS</li>
                    </ol>
                </nav>
                <hr class="mx-auto" style="width: 95%">
        </nav>
    </header>
    <main>
        <section class="container-fluid">
            <div class="row g-0">
                 <i id="filterToggler" class="d-lg-none text-blue fa-solid fa-bars fs-1"></i>                
                        <div id="sidebar" class=" col-lg-3 bg-light d-none d-lg-block">
                            <table class="table table-striped" style="cursor: pointer;">
                                <tr><td class="text-blue cursor-pointer" id="A-Z">A-Z</td></tr>
                                <tr><td class="text-blue cursor-pointer" id="Z-A">Z-A</td></tr>
                                <tr><td class="text-blue cursor-pointer" id="high-low">High - low</td></tr>
                                <tr><td class="text-blue cursor-pointer" id="low-high">low - high</td></tr>  
                            </table>
                        </div>
                <div id="showBook" class="col-lg-9 row px-5 py-3 justify-content-center"></div>
            </div>
        </section>
        
        <div id="spinner" class="d-flex justify-content-center"></div>
    </main>
 
<!--modal of book details -->
<div class="modal fade alert" id="bookDetails" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="bookDetailsHeader" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" id="modalContent">
    </div>
  </div>
</div>
 <div id="cart-alert" class=" position-fixed top-0 end-0 col-6 col-md-3 text-center m-2"></div>
<!-- cart modal -->

<div class="modal fade" id="cartModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">Shopping Cart</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="addToCartModal">
                <div class="accordion" id="accordionExample">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                        <button class="accordion-button fs-4" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                            Cart items
                        </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div id="modalRow" class="row flex-column align-items-center">
                            </div>
                        </div>
                    </div>
                </div>
            
                <hr class="mx-auto" style="width:90%">
                <div class="px-5 py-3 shadow col-12 col-md-7 mx-auto">
                    <h5>Order Summary</h5>
                    <h6 id="quantity" class="text-blue px-md-5"></h6>
                    <h6 id="sum" class="text-orange px-md-5"></h6>
                </div>
            </div>
        </div>
    </div>
  </div>
