
<html>
<head>

    <title>Featured Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card-title {
            font-family: sans-serif;
            color: rgb(18, 2, 81);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .text-dark-orange {
            color: #cc5500;
        }

        .card-custom {
            background-color: #F5F5F3;
            transition: transform 0.3s ease;
        }

        .card-custom:hover {
            transform: scale(1.01);
        }

        .card-text {
            color: rgb(18, 2, 81);
        }

        .img-fit {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .mlogn {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 100%;
        }

        .login-btn {
            flex: 1;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1.3px solid rgb(18, 2, 81);
            background-color: transparent;
            color: rgb(18, 2, 81);
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: rgb(18, 2, 81);
            color: white;
        }

        .star {
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .star:hover {
            transform: scale(1.2);
        }

        /* Responsive ui and mobile menu */
        @media (max-width: 768px) {
            .card {
                flex-direction: column;
            }

            .img-fit {
                height: 200px;
            }

            .card-title {
                font-size: 1.5rem;
            }

            .mlogn {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .card-title {
                font-size: 1.3rem;
            }

            .card-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
<!-- fetured book  image with title and description-->
<div class="container mt-4">
    <div class="card card-custom d-flex flex-row align-items-stretch p-0 shadow">

        <img src="fbook.jpeg" class="img-fit" alt="Book Cover">

        <div class="card-body d-flex flex-column justify-content-start">

            <h3 class="card-title mb-2">Featured Book</h3>
            <h6 class="text-dark-orange fw-bold mb-1">─────────</h6>
            <h6 class="fw-bold mb-2">By TIMBUR HOOD</h6>

            <h3 class="card-title mb-2">Bird Gonna be Happy</h3>

            <p class="card-text mb-3 lh-lg" id="description">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed eu feugiat amet, libero ipsum enim pharetra hac.
            </p>

            <h6 class="text-dark-orange fw-bold fs-5 mb-2">
                $ <span id="price">45</span>
            </h6>
<!--quaninty of items starting from 1 to as much as u want-->
            
            <div class="d-flex align-items-center gap-2 mb-2">
                <button class="btn btn-outline-dark btn-sm" onclick="changeQty(-1)">-</button>
                <span id="quantity">1</span>
                <button class="btn btn-outline-dark btn-sm" onclick="changeQty(1)">+</button>
            </div>

            <p class="fw-bold mb-3">
                Total: $ <span id="total">45</span>
            </p>
<!-- stars rating from 1 to 5 and it displays below the star number you rated-->
            
            <div class="mb-3">
                <span class="star" onclick="rate(1)">⭐</span>
                <span class="star" onclick="rate(2)">⭐</span>
                <span class="star" onclick="rate(3)">⭐</span>
                <span class="star" onclick="rate(4)">⭐</span>
                <span class="star" onclick="rate(5)">⭐</span>
                <span id="rating-text" class="ms-2"></span>
            </div>

           
            <div class="mlogn mb-3">
        <a href="product.html" class="login-btn">
  View More ─>
</a>
                <input type="button" value="Add to Cart" class="login-btn" onclick="addToCart()">
            </div>

           
            <div id="alertBox" class="alert alert-success d-none mt-2">
                Book added to cart successfully!
            </div>

        </div>
    </div>
</div>

<script>
    let quantity = 1;
    let price = 45;
    let descriptionVisible = true;
//function to show description using view more button
    function toggleDescription() {
        const desc = document.getElementById("description");
        descriptionVisible = !descriptionVisible;
        desc.style.display = descriptionVisible ? "block" : "none";
    }
//function to change the quantity like increase and decrease
    function changeQty(value) {
        quantity += value;
        if (quantity < 1) quantity = 1;
        document.getElementById("quantity").innerText = quantity;
        updateTotal();
    }
//function to calculate  total price after increasing quantity
    function updateTotal() {
        let total = quantity * price;
        document.getElementById("total").innerText = total;
    }
//function to add to cart and disaplys book added to cart
    function addToCart() {
        const alertBox = document.getElementById("alertBox");
        alertBox.classList.remove("d-none");

        setTimeout(() => {
            alertBox.classList.add("d-none");
        }, 2000);
    }
//function to make start display ur rating
    function rate(stars) {
        document.getElementById("rating-text").innerText = stars + " / 5";
    }
</script>

</body>
</html>
